spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/local}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    # db/dummy 에는 회원 20만 건(46MB)이 들어 있어서 로컬에서만 읽습니다.
    locations: classpath:db/migration, classpath:db/dummy
    baseline-on-migrate: true
    validate-on-migrate: true

---

spring:
  config:
    activate:
      on-profile: test

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 쿼리 수를 세는 테스트(N+1 확인)에 씁니다.
        generate_statistics: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
